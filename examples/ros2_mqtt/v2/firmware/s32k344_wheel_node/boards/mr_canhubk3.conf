# Static IPv4 on the 100BASE-T1 port (via RDDRONE-T1ADAPT to the NUC).
# Give every robot a unique address and MQTT prefix.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.50.20"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_INIT_TIMEOUT=10

CONFIG_PWM=y
CONFIG_SENSOR=y

# No TRNG driver: timer-based random, only used to tell resets apart.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
