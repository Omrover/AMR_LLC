# Run the firmware as a Linux process: host sockets, simulated wheel.
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_LAB_BROKER_ADDR="127.0.0.1"
CONFIG_LAB_MQTT_PREFIX="class10/fw"
# Different boot_id on every run
CONFIG_NATIVE_EXTRA_CMDLINE_ARGS="--seed-random"
