# Broker for the real robot link. The NUC's Ethernet port that faces the
# robot (via RDDRONE-T1ADAPT) must have the address 192.168.50.1/24.
# Anonymous access: use only on this isolated point-to-point link.
listener 18883 192.168.50.1
listener 18883 127.0.0.1
allow_anonymous true
persistence false
