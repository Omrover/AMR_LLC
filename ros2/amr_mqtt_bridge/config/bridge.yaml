# Parámetros del enlace y de la base. Ver AMR_LLC/protocol/CONTRACT.md.
amr_mqtt_bridge:
  ros__parameters:
    broker_host: 127.0.0.1
    broker_port: 18883
    mqtt_prefix: omrover/mm01
    stale_timeout: 1.0          # s sin telemetría -> STALE
    ack_timeout: 0.5            # s de espera del ack en los servicios
    time_sync_window: 5.0

    odom_frame: odom
    base_frame: base_footprint
    imu_frame: imu_link
    publish_tf: true            # false si robot_localization publica odom->base
    use_stamped_cmd_vel: false  # igual que enable_stamped_cmd_vel de Nav2 (Jazzy: false)
    cmd_rate_hz: 20.0
    cmd_vel_timeout: 0.2        # s: cmd_vel más viejo se reemplaza por cero
    cmd_valid_ms: 250           # watchdog del MCU (<= 250 por contrato)
    max_linear: 1.0             # m/s (contrato permite 2.0)
    max_angular: 2.0            # rad/s (contrato permite 4.0)
    wheel_joints: [wheel_fl_joint, wheel_rl_joint, wheel_rr_joint, wheel_fr_joint]
    unused_covariance: 1.0e6
    imu_orientation_variance: 1.0e-3
    imu_gyro_variance: 1.0e-4
    imu_accel_variance: 1.0e-2

    # LiPo 6S 6000 mAh. Umbrales en voltios (3.6 y 3.5 V/celda bajo carga).
    battery_cells: 6
    battery_capacity_ah: 6.0
    battery_low_volt: 21.6
    battery_critical_volt: 21.0
