# Calibración del brazo (4x GIM6010-8) y del gripper. Se carga junto a bridge.yaml.
# rad = sign * (counts - zero_offset) * 2*pi / (counts_per_rev * gear_ratio)
/**:   # también lo usa el MCU simulado de amr_gazebo (gz_mcu)
  ros__parameters:
    arm_joints: [arm_joint_1, arm_joint_2, arm_joint_3, arm_joint_4]
    arm_counts_per_rev: 16384
    # TBD: verificar si los 16384 counts/rev del 0xA4/0xDA son del eje de salida
    # (gear_ratio = 1.0) o del rotor antes del reductor 8:1 (gear_ratio = 8.0).
    arm_gear_ratio: 1.0
    # zero_offset: counts en la pose q = 0 del DH. Los GIM6010-8 guardan la última
    # posición al apagarse, pero el brazo cae sin energía y esa cuenta deja de valer.
    # Se calibra en cada arranque con el brazo quieto en arm_ref_pose:
    #   ros2 service call /arm/calibrate std_srvs/srv/Trigger
    # Con el robot real, llc_bridge.launch.py guarda el resultado en
    # arm_calibration_file (~/.ros/amr_arm_calibration.yaml), que tiene prioridad
    # sobre este valor si coinciden arm_sign y la escala.
    arm_zero_offset: [0, 0, 0, 0]
    arm_ref_pose: [3.14159, -0.059, 0.058, 0.0]  # rad: brazo sentado en su tope (dentro de
    #                                              los límites de la URDF; q1 <= pi)
    # arm_require_calibration y arm_calibration_file los pone llc_bridge.launch.py
    # (robot real); el emulador y Gazebo no exigen ni guardan calibración.
    arm_sign: [-1, -1, -1, -1]        # sentido motor vs. sentido DH (medido en el robot)
    arm_lower: [-3.1416, -1.5708, -2.5, -2.5]   # rad, params.xacro (q1 = ±pi alcanza la bandeja)
    # q3 <= 0.1: con el eslabón 3 en L y el brazo en un solo plano, más allá el
    # antebrazo atraviesa el eslabón 2 (el codo no puede cruzarlo). TBD con el CAD.
    arm_upper: [3.1416, 1.5708, 0.1, 2.5]
    arm_default_accel: 2.0            # rad/s^2 si el cliente no especifica
    arm_status_rate_hz: 10.0
    gripper_joint: gripper_finger_joint
    gripper_travel: 0.035             # m por dedo, igual que params.xacro
