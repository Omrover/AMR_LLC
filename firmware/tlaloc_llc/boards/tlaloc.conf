# IP estática en el enlace Ethernet directo con la NUC (eno1 = 192.168.50.1)
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.50.20"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_INIT_TIMEOUT=10

CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_I2C=y
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_SPI=y
# Brazo: 4 GIM6010-8 en FlexCAN0 a 1 Mbps
CONFIG_CAN=y
CONFIG_WATCHDOG=y

# El EKF y la cinemática usan float; el Cortex-M7 tiene FPU
CONFIG_FPU=y

# El driver KSZ8081 de Zephyr reinicia la autonegociación (BMCR restart) en
# cada ciclo del monitor si no terminó en PHY_AUTONEG_TIMEOUT_MS (4 s por
# defecto). Con la NUC o un switch gigabit la negociación puede tardar más, y
# el reinicio la corta antes de que suba el enlace; el ejemplo RTD no toca el
# PHY y por eso sí enlaza. 15 s da margen sin retrasar el caso normal.
CONFIG_PHY_AUTONEG_TIMEOUT_MS=15000
