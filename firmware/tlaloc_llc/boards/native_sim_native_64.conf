# SIL: el firmware corre como proceso Linux con RoboClaw y BNO080 simuladas y
# habla con el broker local por sockets del host.
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_ETH_NATIVE_TAP=n
CONFIG_TLALOC_BROKER_ADDR="127.0.0.1"
# boot_id distinto en cada ejecución
CONFIG_NATIVE_EXTRA_CMDLINE_ARGS="--seed-random"
