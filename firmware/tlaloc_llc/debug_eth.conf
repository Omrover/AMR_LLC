# Diagnóstico del enlace Ethernet (KSZ8091RND). Se agrega al build normal:
#   west build -b tlaloc -p -- -DEXTRA_CONF_FILE=debug_eth.conf
# Shell en la consola OpenSDA (115200): `net iface`, `net ping 192.168.50.1`,
# `mdio ...` para leer registros del PHY. Ver README, "Si no hay enlace".
CONFIG_SHELL=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_NET_SHELL=y
CONFIG_MDIO_SHELL=y
CONFIG_PHY_LOG_LEVEL_DBG=y
CONFIG_ETHERNET_LOG_LEVEL_DBG=y
# Sin movimiento: solo se prueba la red
CONFIG_TLALOC_ALLOW_MOTION=n
