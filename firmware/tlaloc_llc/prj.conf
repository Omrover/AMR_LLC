# Red + MQTT 3.1.1 sobre TCP (enlace punto a punto con la NUC)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_MQTT_LIB=y

# printf de float/int64 en el JSON
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_REQUIRES_FULL_LIBC=y

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=6144
# main = cliente MQTT: por debajo de los hilos de control (2) e IMU (3)
CONFIG_MAIN_THREAD_PRIORITY=5
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
